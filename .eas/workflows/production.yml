name: Production native builds

on:
  workflow_dispatch: {}

jobs:
  verify_api:
    name: Verify production API
    environment: production
    steps:
      - uses: eas/checkout

      - name: Require current main commit
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Production builds must run from the current main commit."
            exit 1
          fi

      - name: Check production API health
        run: |
          node --input-type=module <<'NODE'
          const apiOrigin = "https://hyre-worker-nestjs-production.fly.dev";
          const request = (path) =>
            fetch(new URL(path, apiOrigin), {
              headers: { "x-request-id": `mobile-release-${Date.now()}` },
              signal: AbortSignal.timeout(10_000),
            });

          const [rootResponse, healthResponse] = await Promise.all([
            request("/"),
            request("/health"),
          ]);

          if (!rootResponse.ok || !healthResponse.ok) {
            throw new Error(
              `Production API is unhealthy: root=${rootResponse.status}, health=${healthResponse.status}`,
            );
          }

          const root = await rootResponse.json();
          const health = await healthResponse.json();

          if (root.environment !== "production" || health.status !== "ok") {
            throw new Error("Production API returned an unexpected environment or health status");
          }
          NODE

  approve:
    name: Approve native release
    needs: [verify_api]
    type: require-approval

  build_android:
    name: Android production
    needs: [approve]
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: iOS production
    needs: [approve]
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android to Play Console
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
