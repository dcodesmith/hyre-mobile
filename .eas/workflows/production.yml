name: Production native builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build_android:
    name: Android production
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: iOS production
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android to Play Console
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
