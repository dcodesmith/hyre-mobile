name: Preview native builds

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build_android:
    name: Android preview
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: iOS preview
    type: build
    params:
      platform: ios
      profile: preview

  submit_android:
    name: Submit Android to Play Console
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: preview

  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: preview
